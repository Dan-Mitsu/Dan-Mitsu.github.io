baseURL = "https://dan-mitsu.github.io/"
locale = "zh-cn"
title = "DanMitsu个人空间"
theme = "PaperMod"

[params]
  customCSS = ["/css/custom.css"]
  homeInfoParams = {
    Title = "一些随记",
    Content = "关于个人  关于世界  关于思考"
  }
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  hideFooter = false
  comments = true
  disableSpecial1stPost = true
  ShowRssButtonInSectionTermList = true

[params.giscus]
    repo = "dan-mistu/dan-mitsu.github.io"
    repoId = "R_kgDOVZA_uw"
    category = "Announcements"
    categoryId = "DIC_kwDOVZA_u84DJvIz"
    mapping = "title"
    strict = "0"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    lightTheme = "light"
    darkTheme = "dark"
    lang = "zh-CN"

[menu]
  [[menu.main]]
    name = "文章"
    pageRef = "/posts"
    weight = 1
  [[menu.main]]
    name = "关于"
    pageRef = "/about"
    weight = 2