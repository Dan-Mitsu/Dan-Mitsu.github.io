baseURL = "https://dan-mitsu.github.io/"
locale = "zh-cn"
title = "DanMitsu个人空间"
theme = "PaperMod"

[params]
  customCSS = ["/css/custom.css"]
  homeInfoParams = {
    Title = "一些随记",
    Content = "关于个人  关于世界  关于思考"
  }
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  hideFooter = false
  comments = true
  disableSpecial1stPost = true
  ShowRssButtonInSectionTermList = true

[menu]
  [[menu.main]]
    name = "文章"
    pageRef = "/posts"
    weight = 1
  [[menu.main]]
    name = "关于"
    pageRef = "/about"
    weight = 2